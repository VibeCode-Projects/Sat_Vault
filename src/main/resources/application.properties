spring.application.name=SatVault
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sat_vault?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=satvault
spring.datasource.password=satvault_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# SatVault Storage & AES-256-GCM Encryption
satvault.storage.dir=./vault-storage
satvault.encryption.master-key=${SATVAULT_MASTER_KEY:U2F0VmF1bHRTZWN1cmVBRVMyNTZLZXlGb3JEZW1vMTIzIQ==}
